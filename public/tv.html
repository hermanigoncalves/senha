<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV - Chamada de Pacientes</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: #030712;
 color: #00ff66;
 font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
 text-align: center;
 user-select: none;
 overflow: hidden;
 height: 100vh;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 position: relative;
}

.header-status {
 position: fixed;
 top: 15px;
 right: 20px;
 display: flex;
 align-items: center;
 gap: 8px;
 font-size: 14px;
 color: #6b7280;
 font-weight: 500;
 letter-spacing: 1px;
 text-transform: uppercase;
 opacity: 0.7;
}

.status-dot {
 width: 10px;
 height: 10px;
 background: #10b981;
 border-radius: 50%;
 box-shadow: 0 0 10px #10b981;
 animation: pulseDot 2s infinite;
}

@keyframes pulseDot {
 0%, 100% { opacity: 1; transform: scale(1); }
 50% { opacity: 0.4; transform: scale(0.85); }
}

.container {
 width: 92%;
 max-width: 1280px;
 padding: 50px 40px;
 border-radius: 28px;
 background: rgba(15, 23, 42, 0.85);
 border: 2px solid rgba(0, 255, 102, 0.25);
 box-shadow: 0 0 70px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 255, 102, 0.05);
 transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
 backdrop-filter: blur(10px);
}

/* Efeito visual ao chamar paciente */
.container.chamada-animada {
 animation: flashGlow 1.2s ease-in-out 3;
}

@keyframes flashGlow {
 0% {
  border-color: rgba(0, 255, 102, 0.25);
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.9);
  transform: scale(1);
 }
 50% {
  border-color: #00ffff;
  box-shadow: 0 0 120px rgba(0, 255, 255, 0.95);
  transform: scale(1.02);
 }
 100% {
  border-color: rgba(0, 255, 102, 0.25);
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.9);
  transform: scale(1);
 }
}

.label-titulo {
 font-size: 26px;
 text-transform: uppercase;
 letter-spacing: 4px;
 color: #9ca3af;
 margin-bottom: 10px;
 font-weight: 600;
}

h1 {
 font-size: 140px;
 margin: 0;
 color: #00ff66;
 text-shadow: 0 0 35px rgba(0, 255, 102, 0.7);
 letter-spacing: 4px;
 font-weight: 900;
 line-height: 1.1;
}

h2 {
 font-size: 68px;
 color: #00ffff;
 margin: 25px 0 15px 0;
 text-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
 font-weight: 700;
 word-break: break-word;
}

h3 {
 font-size: 58px;
 color: #ffffff;
 margin: 15px 0 0 0;
 text-shadow: 0 0 18px rgba(255, 255, 255, 0.6);
 font-weight: 600;
}

</style>

</head>
<body>

<div class="header-status">
 <div class="status-dot" id="statusDot"></div>
 <span id="statusTexto">TV Conectada</span>
</div>

<div class="container" id="painelTv">

<div class="label-titulo">SENHA</div>

<h1 id="senhaTv">
AGUARDANDO
</h1>

<h2 id="nomeTv">
---
</h2>

<h3 id="guicheTv">
---
</h3>

</div>

<script>

let audioCtx = null;
let vozesDisponiveis = [];

function carregarVozes() {
 if (typeof window.speechSynthesis !== 'undefined') {
  vozesDisponiveis = window.speechSynthesis.getVoices() || [];
 }
}

if (typeof window.speechSynthesis !== 'undefined') {
 carregarVozes();
 window.speechSynthesis.onvoiceschanged = carregarVozes;
}

function obterOuCriarAudioContext() {
 if (!audioCtx) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 }
 if (audioCtx.state === 'suspended') {
  audioCtx.resume().catch(() => {});
 }
 if (window.speechSynthesis) {
  window.speechSynthesis.resume();
 }
 return audioCtx;
}

function autoDesbloquearTV() {
 const ctx = obterOuCriarAudioContext();
 if (ctx && ctx.state === 'suspended') {
  ctx.resume().catch(() => {});
 }

 try {
  const bufferSilencioso = ctx.createBuffer(1, 1, 22050);
  const fonte = ctx.createBufferSource();
  fonte.buffer = bufferSilencioso;
  fonte.connect(ctx.destination);
  fonte.start(0);
 } catch(e) {}

 if (window.speechSynthesis) {
  window.speechSynthesis.resume();
 }
}

// Desbloqueio automático contínuo sem requerer clique manual
window.addEventListener('DOMContentLoaded', autoDesbloquearTV);
window.addEventListener('load', autoDesbloquearTV);
window.addEventListener('focus', autoDesbloquearTV);

['click', 'touchstart', 'mousemove', 'keydown', 'pointerdown', 'scroll'].forEach(evt => {
 window.addEventListener(evt, autoDesbloquearTV, { passive: true });
});

function tocarDingDong() {
 try {
  const ctx = obterOuCriarAudioContext();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
   ctx.resume().catch(() => {});
  }
  const now = ctx.currentTime;

  // Nota 1 (Mi5 - ~659Hz)
  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(659.25, now);
  gain1.gain.setValueAtTime(0.7, now);
  gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  osc1.connect(gain1);
  gain1.connect(ctx.destination);
  osc1.start(now);
  osc1.stop(now + 0.6);

  // Nota 2 (Dó5 - ~523Hz)
  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(523.25, now + 0.35);
  gain2.gain.setValueAtTime(0.7, now + 0.35);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
  osc2.connect(gain2);
  gain2.connect(ctx.destination);
  osc2.start(now + 0.35);
  osc2.stop(now + 1.2);
 } catch(e) {
  console.error('Erro ao emitir bipe ding dong:', e);
 }
}

function executarChamadaSonora(senha, nome, guiche) {
 autoDesbloquearTV();

 const texto = `Atenção. Senha ${senha}. Paciente ${nome}. Dirigir-se ao guichê ${guiche}`;

 // 1. Toca o bipe Ding-Dong imediatamente
 tocarDingDong();

 // 2. Aguarda 1.1s (tempo do bipe) para iniciar a fala do nome
 setTimeout(() => {
  falarTexto(texto);
 }, 1100);
}

function falarTexto(texto) {
 const urlTts = `/api/tts?texto=${encodeURIComponent(texto)}`;
 const audio = new Audio();
 let fallbackAcionado = false;

 const acionarFallback = (motivo) => {
  if (fallbackAcionado) return;
  fallbackAcionado = true;
  console.warn('⚠️ Acionando voz nativa do navegador (WebSpeech). Motivo:', motivo);
  sintetizarWebSpeech(texto);
 };

 const timerSeguranca = setTimeout(() => {
  acionarFallback('Timeout de carregamento do MP3');
 }, 2500);

 audio.onerror = () => {
  clearTimeout(timerSeguranca);
  acionarFallback('Falha na rota /api/tts');
 };

 audio.oncanplaythrough = () => {
  clearTimeout(timerSeguranca);
  audio.play().then(() => {
   console.log('✅ Áudio MP3 da chamada reproduzido com sucesso!');
  }).catch(err => {
   acionarFallback('Autoplay bloqueado no HTML5 Audio: ' + err);
  });
 };

 audio.src = urlTts;
 audio.load();
}

function sintetizarWebSpeech(texto) {
 if (!('speechSynthesis' in window)) {
  console.error('SpeechSynthesis não suportado neste navegador.');
  return;
 }

 window.speechSynthesis.resume();
 window.speechSynthesis.cancel();

 setTimeout(() => {
  window.speechSynthesis.resume();

  const msg = new SpeechSynthesisUtterance(texto);
  msg.lang = 'pt-BR';
  msg.rate = 0.88;
  msg.pitch = 1.0;
  msg.volume = 1.0;

  let vozes = window.speechSynthesis.getVoices() || [];
  if (!vozes.length && vozesDisponiveis.length) {
   vozes = vozesDisponiveis;
  }

  if (vozes && vozes.length > 0) {
   const vozPtBr = vozes.find(v => v.lang && (v.lang === 'pt-BR' || v.lang === 'pt_BR' || v.lang.toLowerCase().includes('br')));
   const vozPt = vozes.find(v => v.lang && v.lang.toLowerCase().includes('pt'));
   if (vozPtBr) {
    msg.voice = vozPtBr;
   } else if (vozPt) {
    msg.voice = vozPt;
   }
  }

  msg.onstart = () => {
   console.log('🔊 WebSpeech iniciado para:', texto);
  };

  msg.onerror = (e) => {
   console.error('Erro no WebSpeech:', e);
  };

  window.speechSynthesis.speak(msg);

  const keepAlive = setInterval(() => {
   if (window.speechSynthesis.speaking) {
    window.speechSynthesis.resume();
   } else {
    clearInterval(keepAlive);
   }
  }, 500);

 }, 100);
}

let socket = null;
let ultimaChamadaChave = null;
let usandoPolling = false;

function atualizarTelaEAudio(dados) {
 if (!dados || !dados.senha) return;

 const chaveAtual = `${dados.id || ''}_${dados.senha}_${dados.guiche}_${dados.timestamp || dados.chamado_em || ''}`;
 
 document.getElementById('senhaTv').innerText = dados.senha;
 document.getElementById('nomeTv').innerText = dados.nome || '---';
 document.getElementById('guicheTv').innerText = 'Guichê ' + (dados.guiche || '1');

 const painel = document.getElementById('painelTv');
 if (painel) {
  painel.classList.remove('chamada-animada');
  void painel.offsetWidth;
  painel.classList.add('chamada-animada');
 }

 if (ultimaChamadaChave !== chaveAtual) {
  ultimaChamadaChave = chaveAtual;
  autoDesbloquearTV();
  executarChamadaSonora(dados.senha, dados.nome, dados.guiche);
 }
}

async function checarFilaREST() {
 autoDesbloquearTV();
 try {
  // 1. Tenta obter a última chamada ativa no servidor (sem cache)
  const resUltima = await fetch('/api/pacientes/ultima-chamada?t=' + Date.now(), { cache: 'no-store' });
  if (resUltima.ok) {
   const pacienteChamado = await resUltima.json();
   if (pacienteChamado && pacienteChamado.senha) {
    atualizarTelaEAudio(pacienteChamado);
    return;
   }
  }

  // 2. Fallback: consulta lista de pacientes (sem cache)
  const res = await fetch('/api/pacientes?t=' + Date.now(), { cache: 'no-store' });
  if (res.ok) {
   const fila = await res.json();
   const chamados = fila.filter(p => p.chamado === true);
   if (chamados.length > 0) {
    chamados.sort((a, b) => (b.chamado_em || b.id || 0) - (a.chamado_em || a.id || 0));
    atualizarTelaEAudio(chamados[0]);
   }
  }
 } catch(err) {
  console.warn('Erro ao consultar fila por REST:', err);
 }
}

function iniciarPollingREST() {
 if (usandoPolling) return;
 usandoPolling = true;
 const statusTexto = document.getElementById('statusTexto');
 if (statusTexto) statusTexto.innerText = 'TV Conectada (Polling Realtime)';
 checarFilaREST();
 setInterval(checarFilaREST, 1200);
}

if (typeof io !== 'undefined') {
 try {
  socket = io({ timeout: 3000, reconnectionAttempts: 3 });
  
  socket.on('connect', () => {
   const statusTexto = document.getElementById('statusTexto');
   if (statusTexto) statusTexto.innerText = 'TV Conectada (WebSocket)';
   autoDesbloquearTV();
   checarFilaREST();
  });

  socket.on('connect_error', () => {
   iniciarPollingREST();
  });

  socket.on('novaChamada', (dados) => {
   atualizarTelaEAudio(dados);
  });
 } catch(e) {
  iniciarPollingREST();
 }
} else {
 iniciarPollingREST();
}

// Fallback de garantia: ativa Polling em 2.5s se socket não conectou
setTimeout(() => {
 if (!socket || !socket.connected) {
  iniciarPollingREST();
 }
}, 2500);

</script>

</body>
</html>

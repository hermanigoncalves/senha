<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV - Chamada de Pacientes</title>

<script src="/socket.io/socket.io.js"></script>

<style>

* {
 box-sizing: border-box;
}

body {
 margin: 0;
 background: #030712;
 color: #00ff66;
 font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
 text-align: center;
 user-select: none;
 overflow: hidden;
 height: 100vh;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 position: relative;
}

/* Modal Otimizado para Controle Remoto da TV Box (Botão OK) */
.modal-controle-tv {
 position: fixed;
 top: 0;
 left: 0;
 right: 0;
 bottom: 0;
 background: rgba(3, 7, 18, 0.95);
 z-index: 999999;
 display: flex;
 flex-direction: column;
 align-items: center;
 justify-content: center;
 padding: 30px;
 backdrop-filter: blur(15px);
}

.btn-tv-ok {
 background: linear-gradient(135deg, #10b981, #059669);
 color: #ffffff;
 font-size: 32px;
 font-weight: 900;
 padding: 25px 45px;
 border: 4px solid #34d399;
 border-radius: 20px;
 cursor: pointer;
 box-shadow: 0 0 50px rgba(16, 185, 129, 0.6);
 outline: none;
 transition: all 0.2s ease;
 animation: pulseBtn 1.5s infinite alternate;
 text-transform: uppercase;
 letter-spacing: 2px;
}

.btn-tv-ok:focus, .btn-tv-ok:hover {
 transform: scale(1.08);
 background: linear-gradient(135deg, #34d399, #10b981);
 border-color: #ffffff;
 box-shadow: 0 0 80px rgba(52, 211, 153, 0.9);
}

@keyframes pulseBtn {
 from { transform: scale(1); box-shadow: 0 0 40px rgba(16, 185, 129, 0.5); }
 to { transform: scale(1.04); box-shadow: 0 0 70px rgba(16, 185, 129, 0.8); }
}

.subtitulo-modal {
 color: #9ca3af;
 font-size: 20px;
 margin-top: 20px;
 font-weight: 500;
}

.header-status {
 position: fixed;
 top: 20px;
 right: 20px;
 display: flex;
 align-items: center;
 gap: 10px;
 font-size: 13px;
 color: #9ca3af;
 font-weight: 600;
 letter-spacing: 1px;
 text-transform: uppercase;
 background: rgba(15, 23, 42, 0.7);
 padding: 8px 16px;
 border-radius: 20px;
 border: 1px solid rgba(255, 255, 255, 0.1);
 z-index: 100;
}

.status-dot {
 width: 10px;
 height: 10px;
 background: #10b981;
 border-radius: 50%;
 box-shadow: 0 0 10px #10b981;
}

.container {
 width: 92%;
 max-width: 1280px;
 padding: 50px 40px;
 border-radius: 28px;
 background: rgba(15, 23, 42, 0.85);
 border: 2px solid rgba(0, 255, 102, 0.25);
 box-shadow: 0 0 70px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 255, 102, 0.05);
 transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
 backdrop-filter: blur(10px);
}

.container.chamada-animada {
 animation: flashGlow 1.2s ease-in-out 3;
}

@keyframes flashGlow {
 0% {
  border-color: rgba(0, 255, 102, 0.25);
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.9);
  transform: scale(1);
 }
 50% {
  border-color: #00ffff;
  box-shadow: 0 0 120px rgba(0, 255, 255, 0.95);
  transform: scale(1.02);
 }
 100% {
  border-color: rgba(0, 255, 102, 0.25);
  box-shadow: 0 0 70px rgba(0, 0, 0, 0.9);
  transform: scale(1);
 }
}

.label-titulo {
 font-size: 26px;
 text-transform: uppercase;
 letter-spacing: 4px;
 color: #9ca3af;
 margin-bottom: 10px;
 font-weight: 600;
}

h1 {
 font-size: 140px;
 margin: 0;
 color: #00ff66;
 text-shadow: 0 0 35px rgba(0, 255, 102, 0.7);
 letter-spacing: 4px;
 font-weight: 900;
 line-height: 1.1;
}

h2 {
 font-size: 68px;
 color: #00ffff;
 margin: 25px 0 15px 0;
 text-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
 font-weight: 700;
 word-break: break-word;
}

h3 {
 font-size: 58px;
 color: #ffffff;
 margin: 15px 0 0 0;
 text-shadow: 0 0 18px rgba(255, 255, 255, 0.6);
 font-weight: 600;
}

.diag-audio {
 position: fixed;
 bottom: 15px;
 left: 20px;
 font-size: 12px;
 color: #9ca3af;
 font-family: monospace;
 background: rgba(0, 0, 0, 0.7);
 padding: 6px 12px;
 border-radius: 6px;
 border: 1px solid rgba(255, 255, 255, 0.1);
 text-align: left;
 z-index: 100;
}

</style>

</head>
<body>

<!-- Elementos Fixos no DOM para Desbloqueio de Mídia no Android TV / Roku WebView -->
<audio id="playerAudio" preload="auto" crossorigin="anonymous"></audio>

<!-- Modal Otimizado para Controle Remoto de TV Box (Botão OK) -->
<div id="modalControleTv" class="modal-controle-tv">
 <button id="btnAtivarTv" class="btn-tv-ok" autofocus onclick="desbloquearComControle()">
  🆗 PRESSIONE 'OK' NO CONTROLE PARA ATIVAR A TV
 </button>
 <div class="subtitulo-modal">
  Requisito do Android TV / Roku para liberar a reprodução de som
 </div>
</div>

<div class="header-status">
 <div class="status-dot" id="statusDot"></div>
 <span id="statusTexto">Conectando...</span>
</div>

<div class="container" id="painelTv">

<div class="label-titulo">SENHA</div>

<h1 id="senhaTv">
AGUARDANDO
</h1>

<h2 id="nomeTv">
---
</h2>

<h3 id="guicheTv">
---
</h3>

</div>

<div class="diag-audio" id="diagAudio">
 Áudio: Pressione OK no controle remoto...
</div>

<script>

let audioCtx = null;
let vozesDisponiveis = [];
let audioDesbloqueado = false;
let ultimaChamadaChaveTocada = null;
let pacienteAtualDados = null;

const playerAudio = document.getElementById('playerAudio');

function atualizarDiag(msg) {
 const el = document.getElementById('diagAudio');
 if (el) el.innerText = 'Áudio: ' + msg;
}

function carregarVozes() {
 if (typeof window.speechSynthesis !== 'undefined') {
  vozesDisponiveis = window.speechSynthesis.getVoices() || [];
 }
}

if (typeof window.speechSynthesis !== 'undefined') {
 carregarVozes();
 window.speechSynthesis.onvoiceschanged = carregarVozes;
}

function obterOuCriarAudioContext() {
 if (!audioCtx) {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
 }
 return audioCtx;
}

function desbloquearComControle() {
 const ctx = obterOuCriarAudioContext();
 if (ctx.state === 'suspended') {
  ctx.resume().catch(() => {});
 }

 // Desbloqueia permanentemente o tag <audio> estatico do DOM no Android WebView
 playerAudio.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
 playerAudio.play().then(() => {
  audioDesbloqueado = true;
  localStorage.setItem('cmip_tv_audio_unlocked', 'true');
  ocultarModalControle();
  atualizarDiag('🟢 Liberado via controle (OK)!');
  
  tocarDingDong();
  
  if (pacienteAtualDados && pacienteAtualDados.senha) {
   executarChamadaSonora(pacienteAtualDados.senha, pacienteAtualDados.nome, pacienteAtualDados.guiche, true);
  }
 }).catch(err => {
  audioDesbloqueado = true;
  ocultarModalControle();
  atualizarDiag('🟢 Liberado (Tentativa OK)');
  tocarDingDong();
  if (pacienteAtualDados && pacienteAtualDados.senha) {
   executarChamadaSonora(pacienteAtualDados.senha, pacienteAtualDados.nome, pacienteAtualDados.guiche, true);
  }
 });

 if (window.speechSynthesis) {
  window.speechSynthesis.resume();
 }
}

function ocultarModalControle() {
 const m = document.getElementById('modalControleTv');
 if (m) m.style.display = 'none';
}

function exibirModalControle() {
 const m = document.getElementById('modalControleTv');
 if (m && !audioDesbloqueado) {
  m.style.display = 'flex';
  const btn = document.getElementById('btnAtivarTv');
  if (btn) btn.focus();
 }
}

// Ouvintes globais para qualquer tecla do controle remoto (OK, ENTER, D-Pad)
window.addEventListener('keydown', (e) => {
 if (!audioDesbloqueado) {
  desbloquearComControle();
 }
});

['click', 'touchstart', 'pointerdown'].forEach(evt => {
 window.addEventListener(evt, () => {
  if (!audioDesbloqueado) {
   desbloquearComControle();
  }
 }, { passive: true });
});

function tocarDingDong() {
 try {
  const ctx = obterOuCriarAudioContext();
  if (!ctx) return;
  
  if (ctx.state === 'suspended') {
   ctx.resume().catch(() => {});
  }

  const now = ctx.currentTime;

  const osc1 = ctx.createOscillator();
  const gain1 = ctx.createGain();
  osc1.type = 'sine';
  osc1.frequency.setValueAtTime(659.25, now);
  gain1.gain.setValueAtTime(0.8, now);
  gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
  osc1.connect(gain1);
  gain1.connect(ctx.destination);
  osc1.start(now);
  osc1.stop(now + 0.6);

  const osc2 = ctx.createOscillator();
  const gain2 = ctx.createGain();
  osc2.type = 'sine';
  osc2.frequency.setValueAtTime(523.25, now + 0.35);
  gain2.gain.setValueAtTime(0.8, now + 0.35);
  gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
  osc2.connect(gain2);
  gain2.connect(ctx.destination);
  osc2.start(now + 0.35);
  osc2.stop(now + 1.2);

  atualizarDiag('🔔 Bipe Ding-Dong emitido');
 } catch(e) {
  console.error('Erro ao emitir bipe ding dong:', e);
 }
}

function executarChamadaSonora(senha, nome, guiche, forcarRepeticao = false) {
 const chaveAtual = `${senha}_${guiche}_${pacienteAtualDados?.timestamp || pacienteAtualDados?.chamado_em || ''}`;

 if (!forcarRepeticao && ultimaChamadaChaveTocada === chaveAtual) {
  return;
 }

 const ctx = obterOuCriarAudioContext();
 if (ctx && ctx.state === 'suspended') {
  ctx.resume().catch(() => {});
 }

 const texto = `Atenção. Senha ${senha}. Paciente ${nome}. Dirigir-se ao guichê ${guiche}`;

 // 1. Bipe Ding Dong
 tocarDingDong();

 // 2. Voz MP3 reutilizando a tag <audio> pré-desbloqueada no Android WebView
 setTimeout(() => {
  falarTexto(texto, () => {
   ultimaChamadaChaveTocada = chaveAtual;
  });
 }, 1100);
}

function falarTexto(texto, callbackSucesso) {
 const urlTts = `/api/tts?texto=${encodeURIComponent(texto)}`;
 let fallbackAcionado = false;

 const acionarFallback = (motivo) => {
  if (fallbackAcionado) return;
  fallbackAcionado = true;
  console.warn('⚠️ Acionando voz nativa WebSpeech. Motivo:', motivo);
  atualizarDiag('⚠️ Usando voz nativa WebSpeech');
  sintetizarWebSpeech(texto, callbackSucesso);
 };

 const timerSeguranca = setTimeout(() => {
  acionarFallback('Timeout do MP3 (2.5s)');
 }, 2500);

 playerAudio.onerror = () => {
  clearTimeout(timerSeguranca);
  acionarFallback('Erro HTTP na rota /api/tts');
 };

 playerAudio.onended = () => {
  clearTimeout(timerSeguranca);
  atualizarDiag('✅ Reprodução MP3 concluída!');
  if (callbackSucesso) callbackSucesso();
 };

 // Reutiliza a tag <audio id="playerAudio"> já pré-desbloqueada!
 playerAudio.src = urlTts;
 playerAudio.play().then(() => {
  clearTimeout(timerSeguranca);
  console.log('✅ Áudio MP3 reproduzido com sucesso no tag DOM!');
  atualizarDiag('✅ Reproduzindo MP3 no Android TV...');
 }).catch(err => {
  console.warn('Falha no playerAudio.play():', err);
  acionarFallback('Erro no playerAudio: ' + err.message);
 });
}

function sintetizarWebSpeech(texto, callbackSucesso) {
 if (!('speechSynthesis' in window)) {
  console.error('SpeechSynthesis não suportado no Android WebView.');
  atualizarDiag('❌ SpeechSynthesis indisponível (Usando DingDong)');
  tocarDingDong();
  if (callbackSucesso) callbackSucesso();
  return;
 }

 window.speechSynthesis.resume();
 window.speechSynthesis.cancel();

 setTimeout(() => {
  window.speechSynthesis.resume();

  const msg = new SpeechSynthesisUtterance(texto);
  msg.lang = 'pt-BR';
  msg.rate = 0.88;
  msg.pitch = 1.0;
  msg.volume = 1.0;

  let vozes = window.speechSynthesis.getVoices() || [];
  if (!vozes.length && vozesDisponiveis.length) {
   vozes = vozesDisponiveis;
  }

  if (vozes && vozes.length > 0) {
   const vozPtBr = vozes.find(v => v.lang && (v.lang === 'pt-BR' || v.lang === 'pt_BR' || v.lang.toLowerCase().includes('br')));
   const vozPt = vozes.find(v => v.lang && v.lang.toLowerCase().includes('pt'));
   if (vozPtBr) {
    msg.voice = vozPtBr;
   } else if (vozPt) {
    msg.voice = vozPt;
   }
  }

  msg.onstart = () => {
   console.log('🔊 WebSpeech iniciado:', texto);
   atualizarDiag('🔊 Voz WebSpeech executada');
   if (callbackSucesso) callbackSucesso();
  };

  msg.onerror = (e) => {
   console.error('Erro no WebSpeech:', e);
   atualizarDiag('❌ Erro WebSpeech (Bipe duplo fallback)');
   tocarDingDong();
   if (callbackSucesso) callbackSucesso();
  };

  window.speechSynthesis.speak(msg);

  const keepAlive = setInterval(() => {
   if (window.speechSynthesis.speaking) {
    window.speechSynthesis.resume();
   } else {
    clearInterval(keepAlive);
   }
  }, 500);

 }, 100);
}

let socket = null;
let usandoPolling = false;

function atualizarTelaEAudio(dados) {
 if (!dados || !dados.senha) return;
 pacienteAtualDados = dados;

 const chaveAtual = `${dados.senha}_${dados.guiche}_${dados.timestamp || dados.chamado_em || ''}`;
 
 document.getElementById('senhaTv').innerText = dados.senha;
 document.getElementById('nomeTv').innerText = dados.nome || '---';
 document.getElementById('guicheTv').innerText = 'Guichê ' + (dados.guiche || '1');

 const painel = document.getElementById('painelTv');
 if (painel) {
  painel.classList.remove('chamada-animada');
  void painel.offsetWidth;
  painel.classList.add('chamada-animada');
 }

 if (ultimaChamadaChaveTocada !== chaveAtual) {
  executarChamadaSonora(dados.senha, dados.nome, dados.guiche);
 }
}

async function checarFilaREST() {
 try {
  const resUltima = await fetch('/api/pacientes/ultima-chamada?t=' + Date.now(), { cache: 'no-store' });
  if (resUltima.ok) {
   const pacienteChamado = await resUltima.json();
   if (pacienteChamado && pacienteChamado.senha) {
    atualizarTelaEAudio(pacienteChamado);
    return;
   }
  }

  const res = await fetch('/api/pacientes?t=' + Date.now(), { cache: 'no-store' });
  if (res.ok) {
   const fila = await res.json();
   const chamados = fila.filter(p => p.chamado === true);
   if (chamados.length > 0) {
    chamados.sort((a, b) => (b.chamado_em || b.id || 0) - (a.chamado_em || a.id || 0));
    atualizarTelaEAudio(chamados[0]);
   }
  }
 } catch(err) {
  console.warn('Erro ao consultar fila por REST:', err);
 }
}

function iniciarPollingREST() {
 if (usandoPolling) return;
 usandoPolling = true;
 const statusTexto = document.getElementById('statusTexto');
 if (statusTexto) statusTexto.innerText = 'TV Conectada (Polling Realtime)';
 checarFilaREST();
 setInterval(checarFilaREST, 1200);
}

if (typeof io !== 'undefined') {
 try {
  socket = io({ timeout: 3000, reconnectionAttempts: 3 });
  
  socket.on('connect', () => {
   const statusTexto = document.getElementById('statusTexto');
   if (statusTexto) statusTexto.innerText = 'TV Conectada (WebSocket)';
   checarFilaREST();
  });

  socket.on('connect_error', () => {
   iniciarPollingREST();
  });

  socket.on('novaChamada', (dados) => {
   atualizarTelaEAudio(dados);
  });
 } catch(e) {
  iniciarPollingREST();
 }
} else {
 iniciarPollingREST();
}

setTimeout(() => {
 if (!socket || !socket.connected) {
  iniciarPollingREST();
 }
}, 2500);

window.addEventListener('DOMContentLoaded', () => {
 const btn = document.getElementById('btnAtivarTv');
 if (btn) btn.focus();

 if (localStorage.getItem('cmip_tv_audio_unlocked') === 'true') {
  ocultarModalControle();
  audioDesbloqueado = true;
 }
});

</script>

</body>
</html>
